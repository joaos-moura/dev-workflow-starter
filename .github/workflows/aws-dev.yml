name: Ambiente dev

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ambiente-dev
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap do estado
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.porta.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/porta-aws
        id: porta

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.porta.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: dev-workflow-starter

      - name: Garantir o bucket de estado
        if: steps.porta.outputs.enabled == 'true'
        run: .github/scripts/bootstrap-estado.sh

  aplicar:
    name: Apply dev
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: AWS inerte
        if: needs.bootstrap.outputs.enabled != 'true'
        run: echo "A variável AWS_ROLE_ARN não existe. O ambiente dev não é aplicado e este job termina verde."

      - uses: actions/checkout@v7
        if: needs.bootstrap.outputs.enabled == 'true'

      - uses: actions/setup-node@v5
        if: needs.bootstrap.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: hashicorp/setup-terraform@v4
        if: needs.bootstrap.outputs.enabled == 'true'
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - if: needs.bootstrap.outputs.enabled == 'true'
        run: npm ci

      - if: needs.bootstrap.outputs.enabled == 'true'
        run: npx tsc --noEmit && npx vite build --base /

      - uses: aws-actions/configure-aws-credentials@v6
        if: needs.bootstrap.outputs.enabled == 'true'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: dev-workflow-starter

      - name: Apply do ambiente dev
        if: needs.bootstrap.outputs.enabled == 'true'
        run: .github/scripts/terraform-run.sh apply dev

      - name: Publicar o site
        if: needs.bootstrap.outputs.enabled == 'true'
        working-directory: infra
        run: |
          bucket="$(terraform output -raw bucket_name)"
          aws s3 sync ../dist "s3://${bucket}" --delete
