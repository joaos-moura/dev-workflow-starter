name: reviewdog

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  eslint:
    name: reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
          filter_mode: nofilter
          eslint_flags: .
