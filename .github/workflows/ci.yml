name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validar:invariantes

      - name: Página sem custo nem empresa
        run: npm run validar:pagina

      - run: npm run build

      - name: Validar template do Backstage
        run: npm run validar:backstage

      - name: Validar Terraform
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e
